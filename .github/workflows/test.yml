name: tests

# Runs the golden-output regression net on every push and PR. The harness loads
# the real autism-ap-builder.html and evaluates its <script> in Node, so this
# also catches the silent catastrophe CLAUDE.md warns about: a stray smart/curly
# quote that makes the whole script un-parseable produces no console error in a
# browser, but it makes `node tests/run.mjs` throw here — turning a clinic-time
# "the tool is blank" into a red check before merge.

on:
  push:
    branches: ['**']
  pull_request:

# A branch with an open PR gets both a push and a pull_request event; cancel any
# superseded run for the same ref so we don't run the suite twice over.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # if one Node version breaks, still report the others
      matrix:
        # Test the floor the tests claim (>= 18, per package.json engines) and a
        # current line. A single pin would let a feature that works locally but
        # not on the floor (or vice versa) slip through — the matrix catches the
        # skew instead of just relocating it. Bump alongside the engines floor.
        node-version: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No dependencies to install — the tests are plain Node, so we run them
      # directly. `npm ci` would fail anyway: there is no lockfile.
      - run: npm test
